<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Check Transaction - CreditSecure</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <!-- Navigation Bar -->

    <header class="header">

        <div class="logo">
            CreditSecure
        </div>

        <nav class="nav">
            <a href="/">Home</a>
        </nav>

    </header>


    <!-- Page Heading -->

    <section class="form-header">

        <h1>Check Transaction</h1>

        <p>
            Enter the transaction details below to analyze
            whether the transaction is genuine or suspicious.
        </p>

    </section>


    <!-- Transaction Form -->

    <form class="transaction-form"
          action="/predict"
          method="POST">


        <div class="form-group">

            <label for="amt">
                Transaction Amount
            </label>

            <input type="number"
                   id="amt"
                   name="amt"
                   step="0.01"
                   placeholder="Enter amount"
                   required>

        </div>


        <div class="form-group">

            <label for="category">
                Category
            </label>

            <input type="text"
                   id="category"
                   name="category"
                   placeholder="e.g. grocery_pos"
                   required>

        </div>


        <div class="form-group">

            <label for="gender">
                Gender
            </label>

            <select id="gender"
                    name="gender"
                    required>

                <option value="">
                    Select gender
                </option>

                <option value="M">
                    Male
                </option>

                <option value="F">
                    Female
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="state">
                State
            </label>

            <input type="text"
                   id="state"
                   name="state"
                   placeholder="Enter state"
                   required>

        </div>


        <div class="form-group">

            <label for="city_pop">
                City Population
            </label>

            <input type="number"
                   id="city_pop"
                   name="city_pop"
                   placeholder="Enter population"
                   required>

        </div>


        <div class="form-group">

            <label for="customer_age">
                Customer Age
            </label>

            <input type="number"
                   id="customer_age"
                   name="customer_age"
                   min="1"
                   max="120"
                   placeholder="Enter age"
                   required>

        </div>


        <div class="form-group">

            <label for="lat">
                Customer Latitude
            </label>

            <input type="number"
                   id="lat"
                   name="lat"
                   step="any"
                   placeholder="e.g. 10.8505"
                   required>

        </div>


        <div class="form-group">

            <label for="long">
                Customer Longitude
            </label>

            <input type="number"
                   id="long"
                   name="long"
                   step="any"
                   placeholder="e.g. 76.2711"
                   required>

        </div>


        <div class="form-group">

            <label for="merch_lat">
                Merchant Latitude
            </label>

            <input type="number"
                   id="merch_lat"
                   name="merch_lat"
                   step="any"
                   placeholder="Merchant latitude"
                   required>

        </div>


        <div class="form-group">

            <label for="merch_long">
                Merchant Longitude
            </label>

            <input type="number"
                   id="merch_long"
                   name="merch_long"
                   step="any"
                   placeholder="Merchant longitude"
                   required>

        </div>


        <div class="form-group">

            <label for="transaction_hour">
                Transaction Hour
            </label>

            <input type="number"
                   id="transaction_hour"
                   name="transaction_hour"
                   min="0"
                   max="23"
                   placeholder="0 - 23"
                   required>

        </div>


        <div class="form-group">

            <label for="transaction_day">
                Transaction Day
            </label>

            <input type="number"
                   id="transaction_day"
                   name="transaction_day"
                   min="1"
                   max="31"
                   placeholder="1 - 31"
                   required>

        </div>


        <div class="form-group">

            <label for="transaction_month">
                Transaction Month
            </label>

            <input type="number"
                   id="transaction_month"
                   name="transaction_month"
                   min="1"
                   max="12"
                   placeholder="1 - 12"
                   required>

        </div>


        <div class="form-group">

            <label for="transaction_dayofweek">
                Day of Week
            </label>

            <input type="number"
                   id="transaction_dayofweek"
                   name="transaction_dayofweek"
                   min="0"
                   max="6"
                   placeholder="0 - 6"
                   required>

        </div>


        <div class="form-button">

            <button type="submit">
                Analyze Transaction
            </button>

        </div>

    </form>

</body>

</html>
