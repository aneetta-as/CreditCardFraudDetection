<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - CreditSecure</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header class="header">

        <div class="logo">
            CreditSecure
        </div>

        <nav class="nav">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('login') }}">Login</a>
        </nav>

    </header>


    <div class="auth-container">

        <div class="auth-card">

            <h1>Admin Login</h1>

            <p class="auth-subtitle">
                Login to access the CreditSecure administration panel.
            </p>


            <form method="POST">

                <div class="form-group">

                    <label for="email">
                        Admin Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter admin email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button type="submit" class="btn-primary">
                    Login as Admin
                </button>

            </form>


            <div class="auth-footer">
                Not an admin?
                <a href="{{ url_for('login') }}">User Login</a>
            </div>


            <a href="{{ url_for('home') }}" class="back-home">
                ← Back to Home
            </a>

        </div>

    </div>

</body>

</html>
